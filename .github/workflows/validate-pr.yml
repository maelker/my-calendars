name: Validate pull request

on:
  pull_request:
    paths:
      - events.csv
      - categories.csv
      - scripts/**

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/build_ics.py --check
